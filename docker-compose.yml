services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commercedna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercedna
      POSTGRES_USER: cdna_user
      POSTGRES_PASSWORD: cdna_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdna_user -d commercedna"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commercedna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
