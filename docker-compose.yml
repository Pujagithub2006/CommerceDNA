services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: commercedna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commercedna
      POSTGRES_USER: cdna_user
      POSTGRES_PASSWORD: cdna_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdna_user -d commercedna"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: commercedna-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commercedna-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commercedna
      SPRING_DATASOURCE_USERNAME: cdna_user
      SPRING_DATASOURCE_PASSWORD: cdna_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_apex12345}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_sec_apex987654321}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_apex_demo_secret_2026}
      RAZORPAY_SANDBOX: "true"
      CDNA_VAULT_MASTER_KEY: ${CDNA_VAULT_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
