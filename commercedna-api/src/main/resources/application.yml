server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: commercedna-api
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/commercedna}
    username: ${SPRING_DATASOURCE_USERNAME:commercedna}
    password: ${SPRING_DATASOURCE_PASSWORD:commercedna_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

commercedna:
  version: "1.0.0"
  security:
    master-key: ${COMMERCEDNA_MASTER_KEY:commercedna_production_grade_aes256_master_key_2026!}
    jwt-secret: ${COMMERCEDNA_JWT_SECRET:commercedna_production_jwt_secret_change_immediately_2026!}
  razorpay:
    base-url: "https://api.razorpay.com/v1"

# Springdoc OpenAPI 3.1 Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    io.commercedna: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId}] %logger{36} - %msg%n"
