spring:
  ai:
    openai:
      api-key: "test-openai-key-disabled"
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:commercedna_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

commercedna:
  version: "1.0.0-TEST"
  security:
    master-key: "test_master_encryption_key_commercedna_32_bytes!!"

logging:
  level:
    root: WARN
    io.commercedna: INFO
