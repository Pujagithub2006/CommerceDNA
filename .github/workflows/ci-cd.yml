name: CommerceDNA CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build with Maven
      run: mvn clean compile -B
      
    - name: Run Unit Tests
      run: mvn test -B
      
    - name: Generate Test Coverage Report
      run: mvn jacoco:report -B
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/target/surefire-reports/*.xml'
        
    - name: Code Quality Check (SpotBugs)
      run: mvn spotbugs:check -B || true
      
    - name: Security Scan (OWASP Dependency Check)
      run: mvn org.owasp:dependency-check-maven:check -B || true
      
    - name: Build Docker Image
      run: docker build -t commercedna:latest .
      
    - name: Run Docker Compose Test
      run: docker compose up -d --build
      env:
        RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
        RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
        CDNA_VAULT_MASTER_KEY: ${{ secrets.CDNA_VAULT_MASTER_KEY }}
        
    - name: Health Check
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8080/actuator/health; do sleep 5; done'
        
    - name: Integration Tests
      run: mvn verify -Pintegration -B
      
    - name: Docker Compose Down
      if: always()
      run: docker compose down -v

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          commercedna/commercedna-api:staging
          commercedna/commercedna-api:${{ github.sha }}
        cache-from: type=registry,ref=commercedna/commercedna-api:staging
        cache-to: type=inline